<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1714" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GeoMaster — geografiya o'yinlari</title>
    <meta name="description" content="GeoMaster: davlatlar maydoni, poytaxtlar, bayroqlar va xaritalar bo'yicha geografiya o'yinlari." />
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('geomaster-settings') || '{}');
          var t = (s.state && s.state.theme) || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
